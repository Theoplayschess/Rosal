<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosal AI</title>
<link rel="icon" href="mark.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #161415;
    --panel: #1f1c1d;
    --panel-2: #2a2627;
    --line: #353031;
    --text: #f3efe6;
    --muted: #a39d94;
    --accent: #fff200;
    --ink: #231f20;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header img { width: 34px; height: 34px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header .spacer { flex: 1; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 10px;
  }
  .ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); padding: 6px 12px; font-size: 14px;
  }
  .ghost:hover { color: var(--text); border-color: var(--muted); }
  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  #chat { max-width: 760px; margin: 0 auto; padding: 24px 16px 8px; }
  .hero { text-align: center; padding: 8vh 0 24px; }
  .hero img { width: min(240px, 60vw); }
  .hero p { color: var(--muted); margin: 8px 0 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); padding: 8px 14px; font-size: 14px;
  }
  .chip:hover { border-color: var(--accent); }
  .msg { display: flex; margin: 14px 0; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 86%; padding: 10px 14px; border-radius: 16px;
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .user .bubble { background: var(--accent); color: var(--ink); border-bottom-right-radius: 4px; }
  .assistant .bubble { background: var(--panel-2); border-bottom-left-radius: 4px; }
  .bubble.error { border: 1px solid #a33; color: #f1b0b0; }
  .bubble code {
    background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 5px;
    font: 14px ui-monospace, Menlo, Consolas, monospace;
  }
  .bubble pre {
    background: #100e0f; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0; white-space: pre;
  }
  .bubble pre code { background: none; padding: 0; }
  .dots span {
    display: inline-block; width: 7px; height: 7px; margin: 0 2px;
    background: var(--muted); border-radius: 50%; animation: b 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  footer { padding: 8px 16px 14px; }
  form {
    max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px;
  }
  form:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; resize: none; background: transparent; color: var(--text);
    border: 0; outline: 0; font: inherit; max-height: 160px; padding: 8px;
  }
  #send {
    background: var(--accent); color: var(--ink); font-weight: 700;
    padding: 9px 16px;
  }
  #send:disabled { opacity: .45; cursor: not-allowed; }
  .note { max-width: 760px; margin: 6px auto 0; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <img src="mark.svg" alt="">
  <h1>Rosal AI</h1>
  <div class="spacer"></div>
  <button class="ghost" id="clear" type="button">New chat</button>
</header>

<main id="scroller">
  <div id="chat" aria-live="polite"></div>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Message Rosal AI…" aria-label="Message"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="note">Rosal AI can make mistakes. Check important information.</div>
</footer>

<script>
const chatEl = document.getElementById("chat");
const scroller = document.getElementById("scroller");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const STORE = "rosal-ai-history-v1";

let history = [];
try { history = JSON.parse(localStorage.getItem(STORE) || "[]"); } catch {}
let busy = false;

function save() {
  try { localStorage.setItem(STORE, JSON.stringify(history.slice(-40))); } catch {}
}

// Safe mini-markdown: escape first, then format code, bold, italics.
function render(text) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const parts = text.split(/```/);
  return parts.map((part, i) => {
    if (i % 2 === 1) {
      const code = part.replace(/^[\w+-]*\n/, "");
      return "<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>";
    }
    return esc(part)
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  }).join("");
}

function addMessage(role, text, opts = {}) {
  const row = document.createElement("div");
  row.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble" + (opts.error ? " error" : "");
  if (role === "assistant") bubble.innerHTML = render(text); else bubble.textContent = text;
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scroller.scrollTop = scroller.scrollHeight;
  return bubble;
}

function showHero() {
  chatEl.innerHTML = "";
  const hero = document.createElement("div");
  hero.className = "hero";
  hero.innerHTML = '<img src="logo.svg" alt="Rosal AI"><p>How can I help you today?</p><div class="chips"></div>';
  const chips = hero.querySelector(".chips");
  ["Explain quantum computing simply", "Write a short story about a robot", "Help me plan a weekly workout", "Give me 5 startup ideas"].forEach((t) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = t;
    b.onclick = () => send(t);
    chips.appendChild(b);
  });
  chatEl.appendChild(hero);
}

function restore() {
  chatEl.innerHTML = "";
  if (!history.length) return showHero();
  history.forEach((m) => addMessage(m.role, m.content));
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  if (!history.length) chatEl.innerHTML = "";

  history.push({ role: "user", content: text });
  addMessage("user", text);
  input.value = ""; input.style.height = "auto";

  const bubble = addMessage("assistant", "");
  bubble.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';

  let answer = "";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok || !res.body) {
      let msg = "Something went wrong.";
      try { msg = (await res.json()).error || msg; } catch {}
      throw new Error(msg);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (!data || data === "[DONE]") continue;
        try {
          const chunk = JSON.parse(data);
          if (chunk.response) {
            answer += chunk.response;
            bubble.innerHTML = render(answer);
            scroller.scrollTop = scroller.scrollHeight;
          }
        } catch {}
      }
    }
    if (!answer) throw new Error("Empty reply. Please try again.");
    history.push({ role: "assistant", content: answer });
    save();
  } catch (e) {
    history.pop(); // drop the unanswered user turn so retrying is clean
    bubble.className = "bubble error";
    bubble.textContent = e.message;
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

form.addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
document.getElementById("clear").onclick = () => {
  if (busy) return;
  history = []; save(); showHero();
};

restore();
</script>
</body>
</html>
